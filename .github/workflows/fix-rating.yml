name: Fix aggregate rating
on:
  push:
    branches: [claude/update-website-3ftBv]
    paths: [.github/workflows/fix-rating.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply real Google rating
        run: |
          sed -i 's/"ratingValue": "4.9"/"ratingValue": "4"/; s/"reviewCount": "47"/"reviewCount": "21"/' index.html
          grep -A3 AggregateRating index.html
      - name: Commit and push
        run: |
          rm -f .github/workflows/fix-rating.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add -A
          git commit -m "SEO : AggregateRating avec les vrais chiffres Google (4/5, 21 avis)" \
            -m "Remplace le placeholder 4.9/47 par la note et le volume réels du profil Google Business affichés sur www.astorya.fr." \
            -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_01FYkK3XDXZknUVnWnZanrU4"
          git push
